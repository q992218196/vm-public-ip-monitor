server {
    listen 8081;
    server_name _;
    root /var/www/html/public;
    index index.html;
    client_max_body_size 9m;
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ^~ /private-pcap/ {
        internal;
        alias /monitor-storage/app/private/packet-evidence/;
        default_type application/vnd.tcpdump.pcap;
        send_timeout 300s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /admin/ {
        set $php_upstream buildadmin-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 120s;
    }
    location /api/ {
        set $php_upstream buildadmin-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 120s;
    }
    location ~ \.php$ { return 404; }
    location = /downloads/vm-agent-linux-amd64 {
        alias /agent-dist/vm-agent-linux-amd64;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /downloads/install.sh {
        alias /agent-dist/install.sh;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /downloads/SHA256SUMS {
        alias /agent-dist/SHA256SUMS;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /downloads/uninstall.sh {
        alias /agent-dist/uninstall.sh;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location ^~ /install/ { return 404; }
    location = /install.lock { return 404; }
    location ~ ^/uploads/.*\.(png|jpg|jpeg|webp|gif)$ {
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /uploads/ { return 404; }
}
