memory_limit=512M
upload_max_filesize=4M
post_max_size=9M
max_execution_time=120
expose_php=Off
display_errors=Off
log_errors=On
error_log=/var/www/html/storage/logs/php-error.log
upload_tmp_dir=/var/www/html/storage/app/private/tmp
sys_temp_dir=/var/www/html/storage/app/private/tmp
date.timezone=UTC
opcache.enable=1
