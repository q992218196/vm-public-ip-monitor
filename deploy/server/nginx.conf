limit_conn_zone $server_name zone=monitor_capture:1m;
map $request_method $agent_control_upstream {
    default app:9000;
    ~^GET$ app:9001;
}
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 9m;
    client_body_temp_path /var/log/nginx/client_temp;
    access_log off;
    error_log /var/log/nginx/error.log warn;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    # Only these GET requests use the reserved control pool. Other methods
    # still reach the normal pool and retain Laravel's method/auth checks.
    location = /api/v1/agent/captures/claim {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $agent_control_upstream;
        fastcgi_read_timeout 25s;
    }
    location = /api/v1/agent/update {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $agent_control_upstream;
        fastcgi_read_timeout 25s;
    }
    location ~ ^/api/v1/agent/captures/[a-f0-9-]+/complete$ {
        limit_conn monitor_capture 4;
        limit_conn_status 429;
        client_max_body_size 32m;
        set $capture_upstream app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $capture_upstream;
        fastcgi_read_timeout 130s;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        set $php_upstream app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 130s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
