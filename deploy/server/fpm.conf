[global]
error_log = /var/www/html/storage/logs/php-fpm.log

; Keep bulk ingestion and PCAP uploads in the original bounded pool.
[www]
listen = 9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_slowlog_timeout = 5s
slowlog = /var/www/html/storage/logs/php-fpm-www-slow.log
; PHP has a 120-second execution budget; include blocked I/O in this ceiling.
request_terminate_timeout = 125s

; Only Nginx's two exact GET control routes use this private listener.
; These children share the app container's existing 1 GiB memory limit.
[control]
user = www-data
group = www-data
listen = 9001
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 15s
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_slowlog_timeout = 5s
slowlog = /var/www/html/storage/logs/php-fpm-control-slow.log
request_terminate_timeout = 20s
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 15
