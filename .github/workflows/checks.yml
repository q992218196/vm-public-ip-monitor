name: checks
on: [push, pull_request]
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test -race ./...
        working-directory: agent
      - run: go vet ./...
        working-directory: agent
      - run: bash -n deploy/agent/install.sh
      - run: bash deploy/agent/build.sh
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: monitor_test
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=10s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_pgsql, pdo_sqlite, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: server
      - run: php vendor/phpunit/phpunit/phpunit
        working-directory: server
        env:
          APP_KEY: base64:dGVzdC1vbmx5LWtleS0zMmJ5dGVzLWZvci1jaSEhISE=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: monitor_test
          DB_USERNAME: monitor
          DB_PASSWORD: test-only-password
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
        working-directory: worker
  admin:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: buildadmin
          MYSQL_USER: buildadmin
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -u buildadmin -ptest-only-password --silent" --health-interval=10s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: monitor_test
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=10s --health-retries=10
    env:
      BUILDADMIN_DB_HOST: 127.0.0.1
      BUILDADMIN_DB_DATABASE: buildadmin
      BUILDADMIN_DB_USERNAME: buildadmin
      BUILDADMIN_DB_PASSWORD: test-only-password
      BUILDADMIN_TOKEN_KEY: test-only-buildadmin-token-key-32-bytes
      MONITOR_DB_HOST: 127.0.0.1
      MONITOR_DB_DATABASE: monitor_test
      MONITOR_DB_USERNAME: monitor
      MONITOR_DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, mbstring, pdo_mysql, pdo_pgsql, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/web/package-lock.json
      - run: composer install --no-dev --no-interaction --prefer-dist
        working-directory: admin
      - uses: actions/upload-artifact@v4
        with:
          name: admin-composer-lock
          path: admin/composer.lock
      - run: php -l app/admin/controller/Monitor.php && php -l app/common/connector/MonitorPgsql.php && php -l database/migrations/20260928000000_monitor_menus.php && php -l tools/import-monitor-users.php
        working-directory: admin
      - run: php think migrate:run
        working-directory: admin
      - run: |
          php -r '$db=new PDO("pgsql:host=127.0.0.1;dbname=monitor_test","monitor","test-only-password");$db->exec("CREATE TABLE users (id bigint primary key,name varchar(255),email varchar(255),password varchar(255),role varchar(32))");$p=password_hash("test-admin-password-2026",PASSWORD_BCRYPT);$s=$db->prepare("INSERT INTO users VALUES (?,?,?,?,?)");$s->execute([1,"Admin","admin@example.test",$p,"admin"]);$s->execute([2,"Viewer","viewer@example.test",$p,"viewer"]);'
          php tools/import-monitor-users.php
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=buildadmin","buildadmin","test-only-password");$users=$db->query("SELECT email,password FROM ba_admin WHERE status=\"enable\" ORDER BY email")->fetchAll(PDO::FETCH_ASSOC);if(count($users)!==2 || !password_verify("test-admin-password-2026",$users[0]["password"]))exit(1);'
        working-directory: admin
      - run: |
          set -euo pipefail
          php -r '$db=new PDO("pgsql:host=127.0.0.1;dbname=monitor_test","monitor","test-only-password");$db->exec("CREATE TABLE nodes (id uuid primary key,name text,enabled boolean,cidrs jsonb,last_seen_at timestamp,health jsonb)");'
          sed -i "s/'admin_login_captcha'   => true/'admin_login_captcha'   => false/" config/buildadmin.php
          php -S 127.0.0.1:8099 -t public public/index.php >/tmp/buildadmin-http.log 2>&1 &
          server_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then cat /tmp/buildadmin-http.log; fi; kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS -H 'server: true' -d 'username=admin@example.test&password=test-admin-password-2026' http://127.0.0.1:8099/admin/Index/login >/tmp/buildadmin-login.json
          token=$(python3 -c 'import json; print(json.load(open("/tmp/buildadmin-login.json"))["data"]["userInfo"]["token"])')
          curl -fsS -H 'server: true' -H "batoken: $token" 'http://127.0.0.1:8099/admin/Monitor/index?resource=nodes' >/tmp/buildadmin-nodes.json
          curl -fsS -H 'server: true' -H "batoken: $token" 'http://127.0.0.1:8099/admin/Monitor/count?resource=nodes' >/tmp/buildadmin-count.json
          python3 -c 'import json; nodes=json.load(open("/tmp/buildadmin-nodes.json")); count=json.load(open("/tmp/buildadmin-count.json")); assert nodes["code"]==1 and nodes["data"]["list"]==[] and count["data"]["total"]==0'
        working-directory: admin
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm run build
        working-directory: admin/web
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/prepare.sh
      - run: docker compose --profile screenshots build app web worker
        working-directory: deploy
      - run: docker compose -f compose.yml -f compose.buildadmin.yml build buildadmin-app buildadmin-web
        working-directory: deploy
      - run: docker compose --profile https config --quiet
        working-directory: deploy
      - run: docker compose -f compose.yml -f compose.buildadmin.yml --profile https config --quiet
        working-directory: deploy
      - run: docker run --rm -e MONITOR_DOMAIN=monitor.example.com -v "$PWD/deploy/caddy/Caddyfile.buildadmin:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: docker run --rm -e MONITOR_DOMAIN=monitor.example.com -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: |
          docker run --name vm-monitor-fpm-smoke -d vm-monitor-app:local
          trap 'docker rm -f vm-monitor-fpm-smoke >/dev/null 2>&1 || true' EXIT
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' vm-monitor-fpm-smoke)" = true
      - run: |
          docker run --name vm-monitor-buildadmin-fpm-smoke -d vm-monitor-buildadmin-app:local
          trap 'docker rm -f vm-monitor-buildadmin-fpm-smoke >/dev/null 2>&1 || true' EXIT
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' vm-monitor-buildadmin-fpm-smoke)" = true
      - run: |
          trap 'docker compose --profile screenshots down --remove-orphans >/dev/null 2>&1 || true' EXIT
          worker_uid=$(docker compose --profile screenshots run --rm --no-deps --entrypoint id worker -u)
          worker_gid=$(docker compose --profile screenshots run --rm --no-deps --entrypoint id worker -g)
          sudo mkdir -p /home/vm-monitor-server/worker/tmp
          sudo chown -R "$worker_uid:$worker_gid" /home/vm-monitor-server/worker
          docker compose --profile screenshots up -d --no-deps worker
          sleep 3
          worker_cid=$(docker compose --profile screenshots ps -q worker)
          test -n "$worker_cid"
          test "$(docker inspect -f '{{.State.Running}}' "$worker_cid")" = true
        working-directory: deploy
